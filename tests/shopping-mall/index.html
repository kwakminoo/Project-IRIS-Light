<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>쇼핑몰 데모</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5;}
    header {background:#4CAF50; color:white; padding:1rem; text-align:center;}
    .products {display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:1rem; padding:1rem;}
    .product {background:white; border:1px solid #ddd; border-radius:4px; padding:0.5rem; text-align:center;}
    .product img {max-width:100%; height:auto;}
    .product h2 {font-size:1.1rem; margin:0.5rem 0;}
    .price {color:#e91e63; font-weight:bold;}
  </style>
</head>
<body>
  <header><h1>데모 쇼핑몰</h1></header>
  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="상품1">
      <h2>상품 1</h2>
      <p class="price">₩10,000</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="상품2">
      <h2>상품 2</h2>
      <p class="price">₩15,000</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="상품3">
      <h2>상품 3</h2>
      <p class="price">₩20,000</p>
    </div>
  </section>
</body>
</html>
